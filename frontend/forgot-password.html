<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EduGuard - Reset your password">
    <title>EduGuard | Forgot Password</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="forgot">

    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-logo">
                    <div class="logo-icon">🔑</div>
                    <h1>Reset Password</h1>
                    <p>We'll help you get back in</p>
                </div>

                <!-- Step Indicator -->
                <div class="step-indicator">
                    <div class="step-dot active"></div>
                    <div class="step-dot"></div>
                    <div class="step-dot"></div>
                </div>

                <!-- Step 1: Enter Email -->
                <div class="forgot-step" id="step-0">
                    <div class="form-group">
                        <label for="reset-email">Email Address</label>
                        <input type="email" id="reset-email" placeholder="Enter your registered email">
                    </div>
                    <button class="btn btn-primary" onclick="nextStep(1)">Send OTP →</button>
                </div>

                <!-- Step 2: Enter OTP -->
                <div class="forgot-step" id="step-1" style="display: none;">
                    <p style="text-align: center; color: var(--text-secondary); font-size: 14px; margin-bottom: 8px;">
                        Enter the 4-digit OTP sent to your email
                    </p>
                    <div class="otp-container">
                        <input type="text" maxlength="1" pattern="[0-9]">
                        <input type="text" maxlength="1" pattern="[0-9]">
                        <input type="text" maxlength="1" pattern="[0-9]">
                        <input type="text" maxlength="1" pattern="[0-9]">
                    </div>
                    <button class="btn btn-primary" onclick="nextStep(2)">Verify OTP →</button>
                    <p style="text-align: center; margin-top: 16px; font-size: 13px;">
                        <a href="#" style="color: var(--text-accent);">Resend OTP</a>
                    </p>
                </div>

                <!-- Step 3: New Password -->
                <div class="forgot-step" id="step-2" style="display: none;">
                    <div class="form-group">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" placeholder="Min 6 characters">
                    </div>
                    <div class="form-group">
                        <label for="confirm-new-password">Confirm New Password</label>
                        <input type="password" id="confirm-new-password" placeholder="Re-enter password">
                    </div>
                    <button class="btn btn-primary" onclick="nextStep(3)">Reset Password →</button>
                </div>

                <div class="auth-footer" style="margin-top: 28px;">
                    <a href="index.html">← Back to Login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
